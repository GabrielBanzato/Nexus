# =============================================================================
# Nexus: stack completa
#   cp .env.example .env   (defina as senhas)
#   docker compose up -d --build
#
#   Painel:  http://localhost:5173
#   API:     http://localhost:3000
#   MySQL:   localhost:3307 (acesso externo; internamente os containers usam db:3306)
# =============================================================================
name: nexus

services:
  # ---------------------------------------------------------------------------
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      # ":?" faz o deploy falhar com mensagem clara se a senha não estiver no .env,
      # em vez de o MySQL abortar o init e o container ficar "unhealthy".
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nexus}
      MYSQL_USER: ${MYSQL_USER:-nexus}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no .env}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    volumes:
      - mysql_data:/var/lib/mysql
      # Executado só na primeira subida (volume vazio).
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      # host:container. A 3306 do host já está em uso; externamente o MySQL do Nexus fica na 3307.
      # O container continua escutando na 3306, e é por ela que o backend se conecta (rede interna).
      - "3307:3306"
    healthcheck:
      # CMD-SHELL (e não CMD): sem shell, a variável da senha não seria expandida dentro do container.
      # "$$" escapa o "$" para o Compose não tentar resolver a variável no host.
      # -h 127.0.0.1 força TCP: durante o init o MySQL roda um servidor temporário só com socket,
      # então o check só passa quando o servidor definitivo estiver aceitando conexões.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 20s
      retries: 10
      # Tempo para o primeiro boot inicializar o datadir e rodar o init.sql (falhas aqui não contam).
      start_period: 60s

  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true # tini como PID 1: recolhe processos zumbis do Chrome
    shm_size: 1gb # memória compartilhada para o Chromium
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Rede interna do Docker: nome do serviço + porta do CONTAINER (3306),
      # não a porta publicada no host (3307).
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nexus}
      MYSQL_USER: ${MYSQL_USER:-nexus}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      SCRAPER_HEADLESS: "true"
      SCRAPER_MAX_RESULTS: ${SCRAPER_MAX_RESULTS:-50}
      # Autenticação
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD no .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env (min. 32 caracteres)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      # Atrás do Nginx: o IP real do usuário vem em X-Forwarded-For (rate limit do login).
      TRUST_PROXY: "true"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
