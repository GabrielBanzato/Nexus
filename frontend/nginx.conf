server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # API: encaminha para o container do backend (nome do serviço no docker-compose).
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Sobrescreve (não concatena): impede o cliente de forjar o IP usado no rate limit do login.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Assets com hash no nome: cache agressivo.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA: qualquer outra rota cai no index.html (sem cache, para pegar deploys novos).
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
